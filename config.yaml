T_var:
  Topt: 18.0
  Hopt: 65.0
dht22:
  pin: 27
  read_interval: 300
  save: true
  saving_dir: /home/fishnplants/Desktop/data/TH/
log:
  directory: /home/fishnplants/Desktop/
  filename: FnP_AeroGreenHouse
  level: INFO
config_reload_interval: 4
gpio_pins:
- name: AEROPONICS
  pin: 19
  what_type: pump
  interval: 1200
  on_time: 5
- name: IDROPONICS
  pin: 12
  what_type: pump
  interval: 29
  on_time: 65
- name: MOISTURE
  pin: 26
  what_type: sensor
spectro:
  read_interval: 3600
  saving_dir: /home/fishnplants/Desktop/data/SPECTRO/
  history_len: 10
plant_growth:
  trig_pin: 5
  echo_pin: 6
  read_interval_days: 1
  n_samples: 3
  reference_height_cm: 70.0
  decimals: 1
  save: true
  saving_dir: /home/fishnplants/Desktop/data/GROWTH/
  history_len: 30
ir_control:
  rx_pin: 20
  tx_pin: 21
  file_ac_name: /home/fishnplants/Desktop/codes/python/AeroGreenHouse/ir_controller/ac_remote.json
  default_temp: 22
  enabled: true
  time_max_on: 10.0
  control_time: 5.0
  T_max: 26.0
  H_max: 65.5
